<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SelfHeal IT Protection</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-safe { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-suspicious { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-dangerous { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .site-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
      color: #e2e8f0;
    }
    .score-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .score-label { font-size: 12px; color: #94a3b8; }
    .score-num { font-size: 18px; font-weight: 700; }
    
    .threat-box {
      margin-top: 8px;
      font-size: 11px;
      color: #fca5a5;
      line-height: 1.4;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px;
      border-radius: 6px;
      border-left: 3px solid #ef4444;
    }

    .scanner-box {
      margin-top: 12px;
    }
    .scanner-box input {
      width: calc(100% - 16px);
      padding: 8px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .scanner-box button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .scanner-box button:hover { background: #1d4ed8; }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SelfHeal IT</h1>
    <span id="badge" class="status-badge badge-safe">Checking...</span>
  </div>

  <div class="site-card">
    <div id="domain" class="domain-title">Scanning current tab...</div>
    <div class="score-container">
      <span class="score-label">Safety Rating</span>
      <span id="score" class="score-num" style="color: #4ade80;">--/100</span>
    </div>
    <div id="threats" class="threat-box" style="display: none;"></div>
  </div>

  <div class="scanner-box">
    <input id="custom-url" placeholder="Test any URL (e.g. login.bank.xyz)">
    <button id="btn-scan">Scan URL with SelfHeal IT</button>
  </div>

  <div class="footer">
    <span><span class="pulse-dot"></span>SelfHeal IT Engine Active</span>
    <span id="backend-status">Connected</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
